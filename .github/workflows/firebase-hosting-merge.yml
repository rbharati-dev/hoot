# Every push to main is tested, and only goes live if every test passes.
# Pull requests are tested but never deployed.
# Deploys use a Firebase CI token stored as the FIREBASE_TOKEN repository
# secret (created with `firebase login:ci`), because new Google Cloud
# projects block service-account key creation by default.
name: Test and deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install browser for tests
        # System packages can fail to download (mirror outages); the runner
        # already has what Chromium needs, so fall back to the browser alone.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Security rules tests (Firestore emulator)
        run: npm run test:rules
      - name: Account tests (real sign-in code against the Firebase Auth emulator)
        run: npm run test:accounts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      # Security rules go live only once accounts are configured (a Firestore
      # database must exist first).
      - if: ${{ vars.VITE_FIREBASE_API_KEY != '' }}
        run: npx --yes firebase-tools deploy --only firestore:rules --project project-b9f72b7f-699d-46ed-aec --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      - run: npx --yes firebase-tools deploy --only hosting --project project-b9f72b7f-699d-46ed-aec --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
