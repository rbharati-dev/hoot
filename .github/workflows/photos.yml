name: Health photos (temporary)
on:
  push:
    branches: [health-photos]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i sharp@0.33.5
      - run: node health-photos.mjs
        timeout-minutes: 40
      - run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -f out && git commit -m "photo results" && git push origin HEAD:health-photos
