# The morning email (see scripts/send-email.mjs). Hourly: confirmation emails
# for new sign-ups; the 6am (Toronto) run also sends the morning email.
# Needs the RESEND_API_KEY secret; without it the job just says so.
name: Morning email
on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      send_now:
        description: Send the morning email now (to everyone due today)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: email
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/send-email.mjs
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_NOW: ${{ inputs.send_now && '1' || '' }}
